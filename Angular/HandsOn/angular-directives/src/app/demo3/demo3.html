<div>
    Select Role:<select [(ngModel)]="userRole">
        <option *ngFor="let role of roles">{{role}}</option>
    </select>
</div>
<div [ngSwitch]="userRole">
    <p *ngSwitchCase="'admin'">👨‍💻 You are an Admin</p>
    <p *ngSwitchCase="'editor'">✍️ You are an Editor</p>
    <p *ngSwitchCase="'viewer'">👀 You are a Viewer</p>
    <p *ngSwitchDefault>❓ Unknown Role</p>
</div>
<hr>
@switch (userRole) {
@case ('admin') {
<p>👨‍💻 You are an Admin</p>
}
@case('editor')
{
<p>✍️ You are an Editor</p>
}
@case('viwer')
{
<p>👀 You are a Viewer</p>
}
@default {
<p>❓ Unknown Role</p>
}
}
