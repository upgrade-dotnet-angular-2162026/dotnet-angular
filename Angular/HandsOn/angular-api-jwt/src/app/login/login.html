<div class="container">
    <table class="table">
        <tr>
            <td>Email</td>
            <td>
                <input [(ngModel)]='email'>
            </td>
        </tr>
        <tr>
            <td>Password</td>
            <td>
                <input type="password" [(ngModel)]="password">
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <button class="btn btn-primary" (click)="validate()">LogIn</button>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <span class="text-warning">{{errMsg}}</span>
            </td>
        </tr>
    </table>
</div>
